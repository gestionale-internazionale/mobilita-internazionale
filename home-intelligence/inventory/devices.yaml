# =============================================================================
# HOME INTELLIGENCE – Registro dispositivi
# =============================================================================
# Ogni voce descrive un dispositivo fisico (o virtuale) e lo collega a:
#   - un ambiente (area di inventory/house.yaml)
#   - una o più funzioni (etichette "hi_*")
#   - le entità Home Assistant che lo rappresentano
#
# stato:
#   reale           dispositivo disponibile, integrato e controllabile
#   non_disponibile previsto ma non ancora installato/identificato/integrato
#   simulazione     entità virtuale, SOLO per l'ambiente di sviluppo
#
# Procedura per collegare un dispositivo reale:
#   1. integra il dispositivo in HA (Impostazioni → Dispositivi e servizi)
#   2. copia gli entity_id in "entita" e porta "stato" a reale
#   3. python3 scripts/hi_tool.py validate
#   4. python3 scripts/hi_tool.py sync --apply   (assegna area + etichette)
#   5. python3 scripts/hi_tool.py docs           (aggiorna il registro in docs/)
#
# Nessun riferimento a entity_id reali compare nelle automazioni: basta questo
# file (o l'assegnazione di etichette/aree dall'interfaccia di HA).
# =============================================================================

dispositivi:

  # ---------------------------------------------------------------------------
  # CLIMATIZZAZIONE – dispositivi reali previsti
  # ---------------------------------------------------------------------------
  - id: daikin_inferiore
    nome: Pompa di calore salotto (piano inferiore)
    marca: Daikin
    modello: Perfera FTXM71N2V1B (unità interna, 2020) + adattatore Wi-Fi BRP069B4x
    tipo: pompa_di_calore
    integrazione: daikin            # integrazione core "Daikin AC", LOCALE (local_polling, scoperta zeroconf)
    area: inferiore_giorno
    stato: non_disponibile          # identificato e compatibile; da integrare su Green/VM
    entita: []                      # es. climate.<nome>, sensor.<nome>_inside_temperature, …
    etichette: [hi_pdc_inferiore, hi_monitorato]
    monitoraggio: [stato, modalita, temperatura_impostata, temperatura_interna, temperatura_esterna,
                   ventola, swing, preset, potenza_compressore, energia, frequenza_compressore]
    comando: [accensione, modalita, setpoint, ventola, swing, preset_eco_boost_away, streamer]
    note: >-
      Adattatore BRP069B4x supportato dall'integrazione core locale (nessun cloud,
      nessuna chiave richiesta). IP attuale 192.168.1.15: riservarlo nel router
      (DHCP statico). Le entità effettive (sensori di energia, streamer) dipendono
      dall'unità: verificarle dopo l'integrazione. Il sensore di temperatura
      ESTERNA dell'unità può alimentare il ruolo hi_temp_esterna (misura
      sull'unità esterna: può essere falsata da sole e sbrinamento). La
      temperatura INTERNA è misurata sull'unità a parete: utile come riferimento
      provvisorio, non ideale per il supervisore (vedi docs/integrazione-dispositivi.md).

  - id: daikin_mansarda
    nome: Pompa di calore mansarda
    marca: Daikin
    modello: Perfera serie FTXM-N (taglia da confermare) + adattatore Wi-Fi BRP069B4x
    tipo: pompa_di_calore
    integrazione: daikin            # integrazione core "Daikin AC", LOCALE
    area: mansarda_principale
    stato: non_disponibile          # identificato e compatibile; da integrare su Green/VM
    entita: []
    etichette: [hi_pdc_mansarda, hi_monitorato]
    monitoraggio: [stato, modalita, temperatura_impostata, temperatura_interna, temperatura_esterna,
                   ventola, swing, preset, potenza_compressore, energia, frequenza_compressore]
    comando: [accensione, modalita, setpoint, ventola, swing, preset_eco_boost_away, streamer]
    note: >-
      Stessa serie e stesso adattatore dell'unità del salotto: valgono le stesse
      capacità e avvertenze. IP attuale 192.168.1.16, da riservare nel router.
      La sigla completa (es. FTXM25N/35N…) serve solo per conoscere la potenza
      nominale, non per l'integrazione.

  - id: termostato_inferiore
    nome: Termostato pavimento piano inferiore
    marca: null                   # acquistato, modello DA FORNIRE
    modello: null
    tipo: termostato
    integrazione: da_verificare   # preferibile Matter/Zigbee/locale
    area: inferiore_giorno
    stato: non_disponibile
    entita: []
    etichette: [hi_termostato_inferiore, hi_monitorato]
    monitoraggio: [temperatura, setpoint, stato_richiesta_calore]
    comando: [setpoint, modalita]
    note: >-
      Il supervisore NON comanda valvole, collettori o caldaie: agisce solo sul
      setpoint del termostato, dopo verifica dell'architettura dell'impianto.
      Il pavimento non viene MAI usato in raffrescamento.

  - id: termostato_mansarda
    nome: Termostato pavimento mansarda
    marca: null
    modello: null
    tipo: termostato
    integrazione: da_verificare
    area: mansarda_principale
    stato: non_disponibile
    entita: []
    etichette: [hi_termostato_mansarda, hi_monitorato]
    monitoraggio: [temperatura, setpoint, stato_richiesta_calore]
    comando: [setpoint, modalita]
    note: Vedi termostato_inferiore.

  # ---------------------------------------------------------------------------
  # ENERGIA – impianto previsto (marca inverter non nota)
  # ---------------------------------------------------------------------------
  - id: inverter_fv
    nome: Inverter fotovoltaico (~6 kWp)
    marca: null
    modello: null
    tipo: inverter
    integrazione: da_verificare   # preferire integrazione locale (Modbus/API locale)
    area: locale_tecnico
    stato: non_disponibile
    entita: []
    etichette: [hi_en_pv_potenza, hi_en_pv_energia, hi_monitorato]
    monitoraggio: [potenza_fv, energia_fv]
    comando: []
    note: Assegnare a ogni entità SOLO l'etichetta del ruolo corrispondente (vedi docs/energia.md).

  - id: batteria
    nome: Sistema di accumulo (10–15 kWh)
    marca: null
    modello: null
    tipo: batteria
    integrazione: da_verificare
    area: locale_tecnico
    stato: non_disponibile
    entita: []
    etichette: [hi_en_batt_soc, hi_en_batt_carica_potenza, hi_en_batt_scarica_potenza,
                hi_en_batt_energia_carica, hi_en_batt_energia_scarica]
    monitoraggio: [soc, potenza_carica, potenza_scarica, energia]
    comando: []
    note: Nessun comando previsto nella prima versione.

  - id: contatore_scambio
    nome: Misura di scambio con la rete
    marca: null
    modello: null
    tipo: contatore
    integrazione: da_verificare   # dall'inverter o da un misuratore dedicato
    area: locale_tecnico
    stato: non_disponibile
    entita: []
    etichette: [hi_en_rete_prelievo_potenza, hi_en_rete_immissione_potenza,
                hi_en_rete_prelievo_energia, hi_en_rete_immissione_energia]
    monitoraggio: [prelievo, immissione]
    comando: []
    note: null

