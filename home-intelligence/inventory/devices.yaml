  - id: sim_impianto_energia
    nome: "[SIM] Fotovoltaico, batteria e scambio"
    tipo: inverter
    integrazione: template
    area: locale_tecnico
    stato: simulazione
    entita:
      - sensor.sim_fv_potenza
      - sensor.sim_fv_energia
      - sensor.sim_rete_potenza_netta
      - sensor.sim_rete_prelievo_energia
      - sensor.sim_rete_immissione_energia
      - sensor.sim_casa_potenza
      - sensor.sim_batteria_soc
      - sensor.sim_batteria_potenza_netta
    # Le etichette per entità sono definite in "ruoli" (una per entità).
    etichette: [hi_simulazione]
    ruoli:
      sensor.sim_fv_potenza: [hi_en_pv_potenza]
      sensor.sim_fv_energia: [hi_en_pv_energia]
      sensor.sim_rete_potenza_netta: [hi_en_rete_potenza_netta]
      sensor.sim_rete_prelievo_energia: [hi_en_rete_prelievo_energia]
      sensor.sim_rete_immissione_energia: [hi_en_rete_immissione_energia]
      sensor.sim_casa_potenza: [hi_en_casa_potenza]
      sensor.sim_batteria_soc: [hi_en_batt_soc]
      sensor.sim_batteria_potenza_netta: [hi_en_batt_potenza_netta]
  - id: sim_telefoni
    nome: "[SIM] Smartphone persone simulate"
    tipo: tracker
    integrazione: device_tracker.see
    area: null
    stato: simulazione
    entita: [device_tracker.sim_telefono_1, device_tracker.sim_telefono_2]
    etichette: [hi_simulazione]
