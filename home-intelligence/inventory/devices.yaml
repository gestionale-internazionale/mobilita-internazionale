  - id: telefoni_companion
    nome: Smartphone con Companion App
    marca: null
    modello: null
    tipo: tracker
    integrazione: mobile_app
    area: null
    stato: non_disponibile
    entita: []                    # device_tracker.* creati dall'app
    etichette: []
