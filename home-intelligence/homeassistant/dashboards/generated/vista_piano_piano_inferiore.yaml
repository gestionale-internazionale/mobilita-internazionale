title: Piano inferiore
path: casa-piano_inferiore
icon: mdi:home-floor-0
subview: true
back_path: /home-intelligence/casa
type: sections
max_columns: 3
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Piano inferiore · planimetria
    heading_style: title
    icon: mdi:home-floor-0
  - type: markdown
    content: '{% if is_state(''binary_sensor.hi_ambiente_simulazione'',''on'') %}<ha-alert alert-type="warning">Ambiente
      di <b>SIMULAZIONE</b>: le entità [SIM] sono virtuali.</ha-alert>{% endif %}<ha-alert alert-type="info">Planimetria
      <b>provvisoria</b> e ambienti da confermare. Tocca la lampadina per accendere/spegnere le luci dell''ambiente.</ha-alert>'
  - type: picture-elements
    image: /local/floorplans/piano_inferiore.svg
    elements:
    - type: state-icon
      entity: binary_sensor.hi_area_inferiore_salotto_luci
      style:
        left: 28.0%
        top: 32.5%
        --mdc-icon-size: 38px
      tap_action:
        action: perform-action
        perform_action: script.hi_area_luci_commuta
        data:
          area: inferiore_salotto
      hold_action:
        action: more-info
    - type: conditional
      conditions:
      - entity: sensor.hi_area_inferiore_salotto_temperatura
        state_not: unavailable
      elements:
      - type: state-label
        entity: sensor.hi_area_inferiore_salotto_temperatura
        style:
          left: 28.0%
          top: 43.5%
          font-size: 15px
          font-weight: '600'
          color: '#3a4150'
    - type: state-icon
      entity: binary_sensor.hi_area_inferiore_salotto_occupata
      style:
        left: 48.0%
        top: 13.0%
    - type: state-icon
      entity: binary_sensor.hi_area_inferiore_cucina_luci
      style:
        left: 65.5%
        top: 22.5%
        --mdc-icon-size: 38px
      tap_action:
        action: perform-action
        perform_action: script.hi_area_luci_commuta
        data:
          area: inferiore_cucina
      hold_action:
