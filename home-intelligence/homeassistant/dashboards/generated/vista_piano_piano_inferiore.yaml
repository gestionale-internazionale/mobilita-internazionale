    heading_style: subtitle
    icon: mdi:door
  - type: area
    area: inferiore_ingresso
    display_type: compact
    alert_classes:
    - moisture
    - motion
    - window
    - door
    sensor_classes:
    - temperature
    - humidity
    features:
    - type: area-controls
    features_position: inline
    navigation_path: /config/areas/area/inferiore_ingresso
- type: grid
  cards:
  - type: heading
    heading: Servizi (provvisoria)
    heading_style: subtitle
    icon: mdi:shower
  - type: area
    area: inferiore_servizi
    display_type: compact
    alert_classes:
    - moisture
    - motion
    - window
    - door
    sensor_classes:
    - temperature
    - humidity
    features:
    - type: area-controls
    features_position: inline
    navigation_path: /config/areas/area/inferiore_servizi
