# =============================================================================
# FILE GENERATO da scripts/hi_tool.py a partire da inventory/house.yaml.
# NON MODIFICARE A MANO: modifica il modello e riesegui
#   python3 scripts/hi_tool.py generate
# =============================================================================
# Sensori aggregati per area (luci accese, temperatura, occupazione).
# Usano area_entities(): ogni dispositivo assegnato all'area viene
# considerato automaticamente, senza modificare questo file.

template:
  # --- Salotto (inferiore_salotto) ---
  - binary_sensor:
      - name: "Luci · Salotto"
        unique_id: hi_area_inferiore_salotto_luci
        default_entity_id: binary_sensor.hi_area_inferiore_salotto_luci
        device_class: light
        icon: "{{ 'mdi:lightbulb-on' if this.state == 'on' else 'mdi:lightbulb-outline' }}"
        state: >
          {% set l = (area_entities('inferiore_salotto') | select('match', 'light\\.') | list
                      + area_entities('inferiore_salotto') | select('in', label_entities('hi_luce')) | list) | unique | list %}
          {{ l | select('is_state', 'on') | list | count > 0 }}
        attributes:
          accese: >
            {% set l = (area_entities('inferiore_salotto') | select('match', 'light\\.') | list
                        + area_entities('inferiore_salotto') | select('in', label_entities('hi_luce')) | list) | unique | list %}
            {{ l | select('is_state', 'on') | list | count }}
          totali: >
            {{ (area_entities('inferiore_salotto') | select('match', 'light\\.') | list
                 + area_entities('inferiore_salotto') | select('in', label_entities('hi_luce')) | list) | unique | list | count }}
      - name: "Occupazione · Salotto"
        unique_id: hi_area_inferiore_salotto_occupata
        default_entity_id: binary_sensor.hi_area_inferiore_salotto_occupata
        device_class: occupancy
        state: >
          {% set ns = namespace(l=[]) %}
          {% for e in area_entities('inferiore_salotto') | select('match', 'binary_sensor\\.') %}
            {% if state_attr(e, 'device_class') in ['motion', 'occupancy', 'presence'] %}{% set ns.l = ns.l + [e] %}{% endif %}
          {% endfor %}
          {{ ns.l | select('is_state', 'on') | list | count > 0 }}
        availability: >
          {% set ns = namespace(l=[]) %}
          {% for e in area_entities('inferiore_salotto') | select('match', 'binary_sensor\\.') %}
            {% if state_attr(e, 'device_class') in ['motion', 'occupancy', 'presence'] %}{% set ns.l = ns.l + [e] %}{% endif %}
          {% endfor %}
          {{ ns.l | reject('is_state', ['unavailable', 'unknown']) | list | count > 0 }}
  - sensor:
      - name: "Temperatura · Salotto"
        unique_id: hi_area_inferiore_salotto_temperatura
        default_entity_id: sensor.hi_area_inferiore_salotto_temperatura
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: >
          {% set v = area_entities('inferiore_salotto') | select('match', 'sensor\\.')
             | select('is_state_attr', 'device_class', 'temperature') | map('states') | select('is_number') | map('float') | list %}
          {{ (v | sum / v | count) | round(1) if v | count > 0 else none }}
        availability: >
          {{ area_entities('inferiore_salotto') | select('match', 'sensor\\.') | select('is_state_attr', 'device_class', 'temperature')
             | map('states') | select('is_number') | list | count > 0 }}
